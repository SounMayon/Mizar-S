name: Build Mizar S firmware

on:
  push:
    branches:
      - codex/filament-runout-resume-fix
    paths:
      - "Marlin2.0.7/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Geeetech LCD35 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Compile firmware
        working-directory: Marlin2.0.7
        run: pio run --environment geeetech_lcd35

      - name: Upload firmware build
        uses: actions/upload-artifact@v4
        with:
          name: mizar-s-geeetech-lcd35
          path: |
            Marlin2.0.7/.pio/build/geeetech_lcd35/firmware.bin
            Marlin2.0.7/.pio/build/geeetech_lcd35/assets/
          if-no-files-found: error
          retention-days: 14
